services:
  pocketrag:
    build: .
    ports:
      - "8550:8550"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - CLAUDE_MODEL=${CLAUDE_MODEL:-claude-opus-5}
    volumes:
      - ./data:/app/data
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8550/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
